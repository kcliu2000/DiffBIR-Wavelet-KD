model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215

      unet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false

      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0

      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"

      controlnet_cfg:
        type: lite
        heavy_1280: true
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: false
      parameterization: eps

dataset:
  train:
    target: diffbir.dataset.gopro_kd_dataset.GoProKDDataset
    params:
      list_path: data_list/gopro_stage2_train_nafnet_wkd_teacher.list
      crop_size: 256
      random_crop: true
      random_flip: true
      prompt: ""

train:
  # wandb logging
  use_wandb: true
  wandb_project: DiffBIR-GoPro-KD
  wandb_entity: kylekai60-national-taiwan-university-of-science-and-tech
  wandb_name: gopro_student_lite_output_wavelet_kd_debug
  wandb_tags:
    - gopro
    - diffbir
    - output_kd
    - wavelet_kd
    - debug

  # pretrained Stable Diffusion v2.1 checkpoint
  sd_path: weights/v2-1_512-ema-pruned.ckpt

  # experiment output directory
  exp_dir: experiments/gopro_student_lite_output_wavelet

  # initialize IRControlNet from official DiffBIR v2 checkpoint
  # debug 階段建議先用官方 v2.pth 初始化，之後壓縮 student 時再另行處理
  resume: null

  learning_rate: 1e-4

  # A4500 debug setting
  batch_size: 1
  num_workers: 4
  train_steps: 100

  log_every: 10
  ckpt_every: 100
  image_every: 999999999
  enable_image_log: false

  noise_aug_timestep: 0

  # KD settings
  use_kd: true
  kd_weight: 0.5

  use_wavelet_kd: true
  wavelet_kd_weight: 0.5
  wavelet_high_freq_weight: 2.0
