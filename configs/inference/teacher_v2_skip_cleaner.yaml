model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: penultimate
      controlnet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false
        type: full
  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.012
      timesteps: 1000
      zero_snr: false
      parameterization: eps
dataset:
  train:
    target: diffbir.dataset.gopro_kd_dataset.GoProKDDataset
    params:
      list_path: data_list/gopro_stage2_train_nafnet_wkd_teacher.list
      crop_size: 256
      random_crop: true
      random_flip: true
      prompt: ''
train:
  use_wandb: false
  wandb_project: DiffBIR-GoPro-KD
  wandb_entity: kylekai60-national-taiwan-university-of-science-and-tech
  wandb_name: teacher_v2_skip_cleaner
  wandb_tags:
  - gopro
  - diffbir
  - output_kd
  - debug
  sd_path: weights/v2-1_512-ema-pruned.ckpt
  exp_dir: experiments/teacher_v2_skip_cleaner
  resume: null
  learning_rate: 0.0001
  batch_size: 1
  num_workers: 4
  train_steps: 100
  log_every: 10
  ckpt_every: 100
  image_every: 999999999
  enable_image_log: false
  noise_aug_timestep: 0
  use_kd: true
  kd_weight: 0.5
  use_wavelet_kd: false
  wavelet_kd_weight: 0.0
  wavelet_high_freq_weight: 2.0
  skip_cleaner: true
